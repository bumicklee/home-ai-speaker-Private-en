# Splash screen (design "Splash"). The images are made by tool/gen_brand_assets.py
# Apply: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B6E6D"
  image: assets/brand/splash_logo.png
  branding: assets/brand/splash_branding.png
  branding_mode: bottom
  branding_bottom_padding: 48
  # Android 12+ only uses the system splash format (icon in the center + branding at the bottom)
  android_12:
    color: "#0B6E6D"
    image: assets/brand/splash_android12.png
    branding: assets/brand/splash_branding.png
  fullscreen: false
  web: false
